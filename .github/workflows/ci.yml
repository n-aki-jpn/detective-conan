name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (Rust)
    runs-on: windows-latest
    defaults:
      run:
        # サーバーはプロジェクトルートから data/ や src/ を相対パス解決するため
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conan_server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('conan_server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --manifest-path conan_server/Cargo.toml

      - name: Build
        run: cargo build --manifest-path conan_server/Cargo.toml

      - name: Test
        run: cargo test --manifest-path conan_server/Cargo.toml

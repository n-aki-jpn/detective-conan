name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Cargo & Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            conan_server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('conan_server/Cargo.lock', 'conan_server/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install worker-build & wasm-bindgen-cli
        run: |
          if ! command -v worker-build >/dev/null 2>&1; then
            cargo install worker-build --version "^0.1" --locked || cargo install worker-build --version "^0.1"
          fi
          if ! wasm-bindgen --version 2>/dev/null | grep -q "0.2.105"; then
            cargo install wasm-bindgen-cli --version 0.2.105 --locked || cargo install wasm-bindgen-cli --version 0.2.105
          fi

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

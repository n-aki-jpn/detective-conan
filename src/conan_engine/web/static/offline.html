<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>オフラインです | 名探偵コナンTCG</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --surface: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #13203b 0%, var(--bg) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      line-height: 1.6;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent);
    }

    .badge svg {
      width: 34px;
      height: 34px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.75;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #082f49;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <h1>オフラインです</h1>
    <p>ネットワーク接続が見つかりません。通信環境をご確認のうえ、再読み込みしてください。</p>
    <div class="status" id="status-text">
      <span class="dot"></span>
      <span>接続の復帰を待機しています…</span>
    </div>
    <div class="actions">
      <button type="button" id="reload-btn">再読み込み</button>
    </div>
  </main>

  <script>
    (function () {
      var reloadBtn = document.getElementById('reload-btn');
      var statusText = document.getElementById('status-text');

      function goHomeOrReload() {
        window.location.replace('/');
      }

      if (reloadBtn) {
        reloadBtn.addEventListener('click', function () {
          if (navigator.onLine) {
            goHomeOrReload();
          } else {
            window.location.reload();
          }
        });
      }

      window.addEventListener('online', function () {
        if (statusText) {
          statusText.textContent = 'オンラインに復帰しました。トップページへ移動します…';
        }
        goHomeOrReload();
      });

      if (navigator.onLine) {
        goHomeOrReload();
      }
    })();
  </script>
</body>
</html>

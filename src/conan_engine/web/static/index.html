<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>名探偵コナンTCG モバイルWeb対戦 & デッキ構築</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --panel-bg: #1e293b;
      --border-color: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --sleep-color: #f59e0b;
      --stun-color: #ef4444;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: calc(180px + var(--safe-bottom)); user-select: none; }
    
    /* Navigation Bar */
    .nav-bar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(10px);
      padding: 6px 12px; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-tabs { display: flex; gap: 6px; }
    .nav-tab-btn {
      background: #1e293b; color: var(--text-muted); border: 1px solid var(--border-color);
      padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.82rem; cursor: pointer; transition: 0.2s;
    }
    .nav-tab-btn.active {
      background: #2563eb; color: #fff; border-color: #3b82f6; box-shadow: 0 0 10px rgba(37,99,235,0.4);
    }
    .nav-actions { display: flex; align-items: center; gap: 6px; }

    .btn {
      background: #2563eb; color: white; border: none; padding: 8px 14px;
      border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: 0.15s; min-height: 38px;
    }
    .btn:active { transform: scale(0.96); opacity: 0.9; }
    .btn-secondary { background: #475569; }
    .btn-danger { background: #dc2626; }
    .btn-success { background: #10b981; }

    /* Screen Views */
    .screen-view { display: none; }
    .screen-view.active { display: block; }

    /* ========== BATTLE SCREEN STYLES ========== */
    .battle-header {
      background: rgba(30, 41, 59, 0.8); padding: 6px 12px;
      border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
    }
    .status-badge { background: #0f172a; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.78rem; color: var(--accent); }
    .board-container { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .player-zone { background: var(--panel-bg); border-radius: 8px; padding: 8px 10px; border: 1px solid var(--border-color); }
    
    .zone-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .player-title { font-weight: bold; font-size: 0.85rem; }
    
    .counters-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px;
    }
    .counter-pill {
      background: rgba(15, 23, 42, 0.6); padding: 3px 2px; border-radius: 4px;
      text-align: center; font-size: 0.68rem; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.05);
    }
    .counter-pill b { display: block; font-size: 0.82rem; color: var(--accent); }

    .zone-content { display: flex; gap: 6px; align-items: stretch; }
    .fixed-cards-col {
      display: flex; flex-direction: column; gap: 6px; width: 95px; flex-shrink: 0;
      justify-content: center; align-items: center;
    }
    .field-slots {
      flex: 1; display: flex; gap: 8px; background: rgba(0,0,0,0.25);
      padding: 6px; border-radius: 6px; overflow-x: auto;
      scrollbar-width: thin; min-height: 130px; align-items: center;
    }

    /* Cards */
    .card {
      background: #1e293b; border: 1.5px solid #475569; border-radius: 6px;
      width: 84px; height: 118px; padding: 0; flex-shrink: 0;
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.35); font-size: 0.65rem;
      cursor: pointer; overflow: hidden; box-sizing: border-box;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
    }
    .card.CHARACTER { border-color: #38bdf8; }
    .card.PARTNER { border-color: #f59e0b; }
    .card.CASE {
      width: 95px; height: 68px; border-color: #a855f7;
    }
    
    .card.SLEEP { border-color: var(--sleep-color); opacity: 0.85; transform: rotate(5deg); }
    .card.STUN { border-color: var(--stun-color); filter: grayscale(80%); }
    .card.secret {
      background: #334155; justify-content: center; align-items: center;
      color: #94a3b8; font-weight: bold; border-style: dashed;
    }
    
    /* Full image card layout */
    .card-img-container {
      width: 100%; height: 100%; position: relative; display: flex; flex-direction: column;
    }
    .card-img-full {
      width: 100%; height: 100%; object-fit: cover; display: block;
      border-radius: 4px;
    }
    .card.CASE .card-img-full {
      object-fit: cover;
    }
    
    /* Overlays on top of the image */
    .card-overlay-top {
      position: absolute; top: 2px; left: 3px; right: 3px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 2;
    }
    .badge-lv {
      background: rgba(15, 23, 42, 0.85); color: #38bdf8; font-weight: bold;
      font-size: 0.62rem; padding: 1px 4px; border-radius: 3px; border: 1px solid rgba(56, 189, 248, 0.4);
      line-height: 1.1;
    }
    .badge-state {
      font-size: 0.75rem; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
    }
    
    .card-overlay-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.7) 65%, rgba(15, 23, 42, 0) 100%);
      padding: 12px 3px 2px 3px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; font-weight: bold; font-size: 0.68rem; line-height: 1;
      z-index: 2;
    }
    .overlay-ap {
      color: #f87171; text-shadow: 0 1px 2px #000;
      background: rgba(0,0,0,0.55); padding: 1px 4px; border-radius: 3px;
    }
    .overlay-lp {
      color: #facc15; text-shadow: 0 1px 2px #000;
      background: rgba(0,0,0,0.55); padding: 1px 4px; border-radius: 3px;
    }

    /* Fallback layout when image is not present */
    .card-fallback {
      width: 100%; height: 100%; padding: 4px; box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .card-top { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.64rem; line-height: 1; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
    .card-badge { color: #38bdf8; font-size: 0.58rem; }
    .card-name { font-weight: bold; font-size: 0.66rem; margin: 2px 0; color: #f8fafc; line-height: 1.15; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .card-stats { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.72rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 2px; line-height: 1; }
    .stat-ap { color: #f87171; }
    .stat-lp { color: #facc15; }

    /* Bottom Dock */
    .bottom-dock {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
      background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(12px);
      border-top: 2px solid var(--accent); padding: 8px 10px calc(8px + var(--safe-bottom)) 10px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    }
    .dock-tabs { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .dock-title { font-size: 0.82rem; font-weight: bold; color: var(--accent); }
    .mobile-hand-scroll {
      display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .mobile-hand-scroll::-webkit-scrollbar { display: none; }
    .mobile-hand-scroll .card { width: 95px; height: 135px; font-size: 0.7rem; }
    .mobile-hand-scroll .card .badge-lv { font-size: 0.65rem; padding: 2px 5px; }
    .mobile-hand-scroll .card .card-overlay-bottom { font-size: 0.74rem; padding-bottom: 3px; }

    .decision-banner {
      background: #1e293b; border: 1.5px solid var(--accent); border-radius: 8px;
      padding: 10px; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .decision-title { font-size: 0.88rem; font-weight: bold; color: var(--accent); margin-bottom: 4px; }
    .decision-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .decision-actions { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Mulligan Selector */
    .mulligan-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; }
    .mulligan-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 4px; border-radius: 6px; border: 2px solid transparent; cursor: pointer;
    }
    .mulligan-item.selected { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }
    .mulligan-item.selected::after { content: "✕ 戻す"; color: #ef4444; font-size: 0.7rem; font-weight: bold; }

    /* ========== DECK BUILDER STYLES ========== */
    .deck-builder-container { padding: 10px; display: flex; flex-direction: column; gap: 12px; }
    .deck-summary-card {
      background: #1e293b; border: 1px solid var(--border-color); border-radius: 8px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .deck-count-bar {
      display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: bold;
    }
    .deck-valid-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: bold; }
    .deck-valid-ok { background: #065f46; color: #34d399; }
    .deck-valid-ng { background: #7f1d1d; color: #f87171; }

    .fixed-select-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.8rem;
    }
    .fixed-select-box select {
      width: 100%; background: #0f172a; color: white; border: 1px solid var(--border-color);
      padding: 6px; border-radius: 6px; font-size: 0.78rem; margin-top: 4px;
    }

    .catalog-search-bar {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .catalog-search-bar input {
      flex: 1; background: #0f172a; color: white; border: 1px solid var(--border-color);
      padding: 8px 12px; border-radius: 6px; font-size: 0.82rem; outline: none;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      width: 100%;
    }
    @media (min-width: 640px) {
      .catalog-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
    }
    @media (min-width: 1024px) {
      .catalog-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }
    .catalog-card-item {
      background: #1e293b; border: 1.5px solid #475569; border-radius: 8px;
      padding: 6px; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 155px; position: relative; font-size: 0.7rem; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }
    .card-qty-controller {
      display: flex; justify-content: space-between; align-items: center; margin-top: 6px;
      background: #0f172a; border-radius: 4px; padding: 2px 4px; border: 1px solid rgba(255,255,255,0.08);
    }
    .qty-btn {
      background: #334155; color: white; border: none; width: 24px; height: 24px;
      border-radius: 4px; font-weight: bold; font-size: 0.9rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:active { background: #2563eb; }
    .qty-num { font-weight: bold; color: var(--accent); font-size: 0.85rem; }

    /* Modal */
    .card-modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .card-modal-content {
      background: #1e293b; border: 2px solid var(--accent); border-radius: 12px;
      width: 100%; max-width: 320px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    .modal-title { font-size: 1rem; font-weight: bold; color: #f8fafc; }
    .modal-body { font-size: 0.82rem; line-height: 1.4; color: #cbd5e1; white-space: pre-wrap; margin-bottom: 14px; max-height: 200px; overflow-y: auto; }
    .modal-footer { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <!-- Top Navigation Bar -->
  <nav class="nav-bar">
    <div class="nav-tabs">
      <button id="tab-battle" class="nav-tab-btn active" onclick="switchTab('battle')">⚔️ 対戦</button>
      <button id="tab-deck" class="nav-tab-btn" onclick="switchTab('deck')">🃏 デッキ構築</button>
    </div>
    <div class="nav-actions">
      <button class="btn btn-secondary" onclick="showRoomModal()" style="padding:4px 8px; font-size:0.75rem; min-height:28px;">📶 対戦ルーム</button>
      <button class="btn btn-secondary" onclick="resetMatch()" style="padding:4px 8px; font-size:0.75rem; min-height:28px;">リセット</button>
    </div>
  </nav>

  <!-- Room Matching Modal -->
  <div id="room-modal" class="card-modal-backdrop" onclick="closeRoomModal()">
    <div class="card-modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span class="modal-title">📶 オンライン対戦ルーム</span>
        <button class="qty-btn" onclick="closeRoomModal()">✕</button>
      </div>
      <div class="modal-body" style="font-size:0.8rem; display:flex; flex-direction:column; gap:12px;">
        <div style="background:#0f172a; padding:8px; border-radius:6px; border:1px solid var(--border-color);">
          <div style="color:var(--text-muted); font-size:0.75rem;">現在の対戦情報:</div>
          <div>ルームID: <b id="current-room-display" style="color:var(--accent); font-size:1rem;">default</b></div>
          <div>あなたの視点: <b id="current-player-display" style="color:#34d399;">player1</b></div>
        </div>

        <!-- Create Room -->
        <div style="display:flex; flex-direction:column; gap:6px;">
          <span style="font-weight:bold; color:var(--text);">1. 新しい部屋を作成 (ホスト側)</span>
          <button class="btn btn-success" onclick="createNewRoom()" style="width:100%;">
            🆕 ルームを作成する (4桁コード)
          </button>
        </div>

        <!-- Join Room -->
        <div style="display:flex; flex-direction:column; gap:6px; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">
          <span style="font-weight:bold; color:var(--text);">2. 相手の部屋に参加 (スマホ等)</span>
          <div style="display:flex; gap:6px;">
            <input type="text" id="join-room-input" placeholder="4桁の部屋番号 (例: 1234)" style="flex:1; background:#0f172a; color:white; border:1px solid var(--border-color); padding:8px; border-radius:6px; font-size:0.85rem; text-align:center;">
            <button class="btn" onclick="joinExistingRoom()" style="padding:8px 14px;">入室</button>
          </div>
        </div>

        <!-- Local reset -->
        <div style="border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">
          <button class="btn btn-secondary" onclick="returnToDefaultRoom()" style="width:100%; font-size:0.75rem; min-height:30px;">
            🏠 既定のローカル/CPU部屋に戻る
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= SCREEN 1: BATTLE ================= -->
  <div id="screen-battle" class="screen-view active">
    <div class="battle-header">
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="status-badge" id="match-info">T:1</span>
        <label style="font-size:0.75rem; display:flex; align-items:center; gap:3px; background:#0f172a; padding:4px 6px; border-radius:4px; border:1px solid #475569;">
          <input type="checkbox" id="cpu-toggle" onchange="toggleCpu(this.checked)" checked>
          <span>CPU</span>
        </label>
      </div>
      <select id="player-select" onchange="switchView(this.value)" style="background:#0f172a; color:white; border:1px solid #475569; padding:4px; border-radius:4px; font-size:0.75rem;">
        <option value="player1">P1視点</option>
        <option value="player2">P2視点</option>
      </select>
    </div>

    <div class="board-container">
      <!-- Decision Banner (Mobile Top) -->
      <div id="decision-box" class="decision-banner" style="display:none;">
        <div id="decision-title" class="decision-title">⚡ 行動選択</div>
        <div id="decision-desc" class="decision-desc"></div>
        <div id="decision-actions" class="decision-actions"></div>
      </div>

      <!-- Opponent Area -->
      <div class="player-zone" id="opp-zone">
        <div class="zone-header">
          <span class="player-title" id="opp-id" style="color:#f87171;">相手</span>
          <span id="opp-case-phase" style="font-size:0.72rem; color:var(--text-muted);">事件編</span>
        </div>
        <div class="counters-grid">
          <div class="counter-pill">山札<b id="opp-deck">-</b></div>
          <div class="counter-pill">手札<b id="opp-hand-count">-</b></div>
          <div class="counter-pill">FILE<b id="opp-file">-</b></div>
          <div class="counter-pill">証拠<b id="opp-evidence">-</b></div>
          <div class="counter-pill">除外<b id="opp-remove">-</b></div>
        </div>
        <div class="zone-content">
          <div class="fixed-cards-col">
            <div id="opp-case" class="card"></div>
            <div id="opp-partner" class="card"></div>
          </div>
          <div id="opp-field" class="field-slots"></div>
        </div>
      </div>

      <!-- Player Area (Field) -->
      <div class="player-zone" id="me-zone">
        <div class="zone-header">
          <span class="player-title" id="me-id" style="color:var(--accent);">自分</span>
          <span id="me-case-phase" style="font-size:0.72rem; color:var(--accent);">事件編</span>
        </div>
        <div class="counters-grid">
          <div class="counter-pill">山札<b id="me-deck">-</b></div>
          <div class="counter-pill">手札<b id="me-hand-count">-</b></div>
          <div class="counter-pill">FILE<b id="me-file">-</b></div>
          <div class="counter-pill">証拠<b id="me-evidence">-</b></div>
          <div class="counter-pill">除外<b id="me-remove">-</b></div>
        </div>
        <div class="zone-content">
          <div class="fixed-cards-col">
            <div id="me-case" class="card"></div>
            <div id="me-partner" class="card"></div>
          </div>
          <div id="me-field" class="field-slots"></div>
        </div>
      </div>
    </div>

    <!-- Hand Bottom Dock -->
    <div class="bottom-dock">
      <div class="dock-tabs">
        <div class="dock-title">
          <span>🃏 手札</span>
          <span style="font-size:0.7rem; color:var(--text-muted);">(タップで詳細)</span>
        </div>
      </div>
      <div id="me-hand" class="mobile-hand-scroll"></div>
    </div>
  </div>

  <!-- ================= SCREEN 2: DECK BUILDER ================= -->
  <div id="screen-deck" class="screen-view">
    <div class="deck-builder-container">
      <!-- Deck Slot Selector Bar -->
      <div style="background:#0f172a; border:1px solid var(--border-color); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.85rem; font-weight:bold; color:var(--accent);">📂 保存済みデッキ一覧</span>
          <button class="btn btn-secondary" onclick="createNewDeckPrompt()" style="padding:4px 10px; font-size:0.75rem; min-height:28px;">＋ 新規デッキ作成</button>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          <select id="saved-decks-select" onchange="onSelectSavedDeck(this.value)" style="flex:1; background:#1e293b; color:white; border:1px solid #475569; padding:6px 8px; border-radius:6px; font-size:0.8rem;"></select>
          <button class="btn btn-danger" onclick="deleteCurrentDeckSlot()" style="padding:4px 8px; font-size:0.75rem; min-height:28px;" title="このデッキを削除">🗑 削除</button>
        </div>
      </div>

      <div class="deck-summary-card">
        <div style="display:flex; gap:8px; align-items:center;">
          <label style="font-size:0.78rem; color:var(--text-muted); flex-shrink:0;">デッキ名:</label>
          <input type="text" id="builder-deck-name" placeholder="デッキ名を入力..." style="flex:1; background:#0f172a; color:white; border:1px solid var(--border-color); padding:5px 8px; border-radius:4px; font-size:0.82rem;" oninput="currentDeckDef.deckName = this.value">
        </div>
        <div class="deck-count-bar">
          <div>デッキ枚数: <span id="builder-total-count" style="color:var(--accent); font-size:1.1rem;">40</span> / 40枚</div>
          <span id="builder-status-badge" class="deck-valid-badge deck-valid-ok">構築完了</span>
        </div>
        <div class="fixed-select-row">
          <div class="fixed-select-box">
            <label style="color:var(--text-muted);">パートナー (1枚)</label>
            <select id="builder-partner-select" onchange="updateDeckPartner(this.value)"></select>
          </div>
          <div class="fixed-select-box">
            <label style="color:var(--text-muted);">事件カード (1枚)</label>
            <select id="builder-case-select" onchange="updateDeckCase(this.value)"></select>
          </div>
        </div>
        <button class="btn btn-success" onclick="saveAndApplyDeck()" style="width:100%; margin-top:4px;">
          💾 デッキを保存して対戦に反映
        </button>
      </div>

      <div>
        <div class="catalog-search-bar">
          <input type="text" id="catalog-search-input" placeholder="🔍 キャラ名・効果・番号で検索..." oninput="filterCatalog(this.value)">
        </div>
        <div id="builder-catalog-container"></div>
      </div>
    </div>
  </div>

  <!-- Card Details Modal -->
  <div id="card-modal" class="card-modal-backdrop" onclick="closeCardModal()">
    <div class="card-modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modal-card-name" class="modal-title">カード名</span>
        <span id="modal-card-badge" class="card-badge" style="font-size:0.75rem;">キャラ</span>
      </div>
      <div id="modal-card-stats" style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:8px; font-size:0.85rem;">
        <span id="modal-card-level">Lv.-</span>
        <span id="modal-card-ap" class="stat-ap">AP -</span>
        <span id="modal-card-lp" class="stat-lp">LP -</span>
      </div>
      <div id="modal-card-desc" class="modal-body"></div>
      <div class="modal-footer">
        <span id="modal-card-id" style="font-size:0.75rem; color:var(--text-muted);">B01001</span>
        <button class="btn btn-secondary" onclick="closeCardModal()" style="padding:5px 12px; font-size:0.8rem; min-height:30px;">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    let currentViewingPlayer = "player1";
    let currentRoomId = "default";
    let lastObs = null;
    let lastRevision = -1;
    let lastDecisionId = null;
    let selectedMulliganIds = new Set();

    // Deck Builder State
    let catalogData = [];
    let currentDeckDef = { partnerId: '', caseId: '', mainDeck: [] };
    let deckQtyMap = {}; // defId -> count
    let builderPage = 0;
    const PAGE_SIZE = 60;

    // Check URL parameters for roomId & player (e.g. ?room=1234&player=player2)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('room')) {
      currentRoomId = urlParams.get('room');
    }
    if (urlParams.has('player')) {
      currentViewingPlayer = urlParams.get('player');
    }

    // ========== NAVIGATION ==========
    function switchTab(tab) {
      document.getElementById('tab-battle').classList.toggle('active', tab === 'battle');
      document.getElementById('tab-deck').classList.toggle('active', tab === 'deck');
      document.getElementById('screen-battle').classList.toggle('active', tab === 'battle');
      document.getElementById('screen-deck').classList.toggle('active', tab === 'deck');
      if (tab === 'deck') {
        loadDeckBuilderData();
      } else {
        lastRevision = -1;
        fetchState();
      }
    }

    // ========== ROOM MODAL & MATCHING ==========
    function showRoomModal() {
      document.getElementById('current-room-display').innerText = currentRoomId;
      document.getElementById('current-player-display').innerText = currentViewingPlayer;
      document.getElementById('room-modal').style.display = 'flex';
    }

    function closeRoomModal() {
      document.getElementById('room-modal').style.display = 'none';
    }

    async function createNewRoom() {
      try {
        const res = await fetch('/api/rooms/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_cpu: false, deck: currentDeckDef })
        });
        const data = await res.json();
        if (data.roomId) {
          currentRoomId = data.roomId;
          currentViewingPlayer = "player1";
          lastRevision = -1;
          selectedMulliganIds.clear();
          
          updateUrlParams();
          closeRoomModal();
          alert(`部屋番号「${currentRoomId}」を作成しました！\n対戦相手のスマホでこの番号を入力して参加してもらってください。`);
          fetchState();
        }
      } catch (e) {
        alert("部屋作成エラー: " + e.message);
      }
    }

    async function joinExistingRoom() {
      const input = document.getElementById('join-room-input');
      const roomId = input ? input.value.trim() : '';
      if (!roomId) {
        alert("部屋番号を入力してください");
        return;
      }
      try {
        const res = await fetch('/api/rooms/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roomId: roomId, deck: currentDeckDef })
        });
        const data = await res.json();
        if (res.ok) {
          currentRoomId = data.roomId;
          currentViewingPlayer = data.assignedPlayerId || "player2";
          lastRevision = -1;
          selectedMulliganIds.clear();

          updateUrlParams();
          closeRoomModal();
          alert(`部屋「${currentRoomId}」に ${currentViewingPlayer} として参加しました！`);
          fetchState();
        } else {
          alert(`参加失敗: ${data.error}`);
        }
      } catch (e) {
        alert("通信エラー: " + e.message);
      }
    }

    function returnToDefaultRoom() {
      currentRoomId = "default";
      currentViewingPlayer = "player1";
      lastRevision = -1;
      selectedMulliganIds.clear();
      updateUrlParams();
      closeRoomModal();
      fetchState();
    }

    function updateUrlParams() {
      const url = new URL(window.location);
      if (currentRoomId !== 'default') {
        url.searchParams.set('room', currentRoomId);
        url.searchParams.set('player', currentViewingPlayer);
      } else {
        url.searchParams.delete('room');
        url.searchParams.delete('player');
      }
      window.history.replaceState({}, '', url);

      const pSel = document.getElementById('player-select');
      if (pSel) pSel.value = currentViewingPlayer;
    }

    // ========== BATTLE SYSTEM ==========
    async function fetchState() {
      try {
        const res = await fetch(`/api/state?player_id=${currentViewingPlayer}&room_id=${currentRoomId}`);
        if (!res.ok) {
          if (res.status === 404 && currentRoomId !== 'default') {
            currentRoomId = 'default';
            updateUrlParams();
            return;
          }
        }
        const data = await res.json();
        
        const curDecId = data.pendingDecision ? data.pendingDecision.decisionId : null;
        const hasChanged = (data.revision !== lastRevision) || (curDecId !== lastDecisionId);
        
        lastObs = data;
        if (hasChanged) {
          lastRevision = data.revision;
          lastDecisionId = curDecId;
          render(data);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function switchView(pid) {
      currentViewingPlayer = pid;
      selectedMulliganIds.clear();
      lastRevision = -1;
      updateUrlParams();
      fetchState();
    }

    async function toggleCpu(isCpu) {
      await fetch('/api/set_cpu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isCpu: isCpu, roomId: currentRoomId })
      });
      fetchState();
    }

    async function resetMatch() {
      selectedMulliganIds.clear();
      lastRevision = -1;
      lastDecisionId = null;
      await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roomId: currentRoomId })
      });
      fetchState();
    }

    async function submitDecision(value) {
      if (!lastObs || !lastObs.pendingDecision) return;
      await fetch('/api/decision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          playerId: currentViewingPlayer,
          roomId: currentRoomId,
          decisionId: lastObs.pendingDecision.decisionId,
          revision: lastObs.revision,
          value: value
        })
      });
      selectedMulliganIds.clear();
      fetchState();
    }

    function showCardModal(card) {
      if (!card) return;
      const name = card.title || card.name || card.dummyName || card.definitionId;
      const typeLabelMap = { PARTNER: 'パートナー', CASE: '事件', CHARACTER: 'キャラ', EVENT: 'イベント' };
      document.getElementById('modal-card-name').innerText = name;
      document.getElementById('modal-card-badge').innerText = typeLabelMap[card.cardType] || card.cardType;
      document.getElementById('modal-card-level').innerText = (card.level > 0 ? `Lv.${card.level} ` : '') + `(${(card.colors || []).join('')})`;
      document.getElementById('modal-card-ap').innerText = `AP ${card.ap ?? '-'}`;
      document.getElementById('modal-card-lp').innerText = `LP ${card.lp ?? '-'}`;
      document.getElementById('modal-card-desc').innerText = card.description || 'テキストなし';
      document.getElementById('modal-card-id').innerText = card.definitionId || '';
      // Show card image if available
      let imgEl = document.getElementById('modal-card-img');
      if (!imgEl) {
        imgEl = document.createElement('img');
        imgEl.id = 'modal-card-img';
        imgEl.style.cssText = 'width:100%; max-width:280px; max-height:380px; object-fit:contain; border-radius:8px; margin-bottom:10px; display:block; margin-left:auto; margin-right:auto; box-shadow:0 4px 15px rgba(0,0,0,0.6);';
        const descEl = document.getElementById('modal-card-desc');
        descEl.parentNode.insertBefore(imgEl, descEl);
      }
      if (card.mainPath) {
        imgEl.src = `/card-images/${card.mainPath}`;
        imgEl.style.display = 'block';
        imgEl.onerror = () => { imgEl.style.display = 'none'; };
      } else {
        imgEl.style.display = 'none';
      }
      document.getElementById('card-modal').style.display = 'flex';
    }

    function closeCardModal() {
      document.getElementById('card-modal').style.display = 'none';
    }

    function createCardEl(card, isSecret = false, disableModal = false) {
      const el = document.createElement('div');
      const cType = card ? (card.cardType || '') : '';
      el.className = `card ${cType} ${card ? (card.orientation || '') : ''}`;
      
      if (!card) {
        el.style.opacity = '0.25';
        el.style.borderStyle = 'dashed';
        el.innerHTML = '<span style="margin:auto; color:#64748b; font-size:0.75rem;">空枠</span>';
        return el;
      }
      if (isSecret || !card.name) {
        el.className += ' secret';
        el.innerHTML = '<span>裏面</span>';
        return el;
      }

      const typeLabel = card.cardType === 'PARTNER' ? 'パートナー' : (card.cardType === 'CASE' ? '事件' : 'キャラ');
      const stateBadge = card.orientation === 'SLEEP' ? '<span class="badge-state">💤</span>' : (card.orientation === 'STUN' ? '<span class="badge-state">⚡</span>' : '');

      if (card.mainPath) {
        el.innerHTML = `
          <div class="card-img-container">
            <img src="/card-images/${card.mainPath}" class="card-img-full" loading="lazy" onerror="this.parentElement.style.display='none'; this.parentElement.nextElementSibling.style.display='flex';">
            <div class="card-overlay-top">
              ${card.level > 0 ? `<span class="badge-lv">Lv.${card.level}</span>` : `<span></span>`}
              ${stateBadge}
            </div>
            ${card.cardType !== 'CASE' ? `
            <div class="card-overlay-bottom">
              <span class="overlay-ap">AP ${card.ap ?? '-'}</span>
              <span class="overlay-lp">LP ${card.lp ?? '-'}</span>
            </div>` : ''}
          </div>
          <div class="card-fallback" style="display:none;">
            <div class="card-top">
              <span class="card-badge">${typeLabel}</span>
              <span>${card.level > 0 ? 'Lv.' + card.level : ''}</span>
            </div>
            <div class="card-name">${card.name || card.definitionId} ${stateBadge}</div>
            <div class="card-stats">
              <span class="stat-ap">AP${card.ap ?? '-'}</span>
              <span class="stat-lp">LP${card.lp ?? '-'}</span>
            </div>
          </div>
        `;
      } else {
        el.innerHTML = `
          <div class="card-fallback">
            <div class="card-top">
              <span class="card-badge">${typeLabel}</span>
              <span>${card.level > 0 ? 'Lv.' + card.level : ''}</span>
            </div>
            <div class="card-name">${card.name || card.definitionId} ${stateBadge}</div>
            <div class="card-stats">
              <span class="stat-ap">AP${card.ap ?? '-'}</span>
              <span class="stat-lp">LP${card.lp ?? '-'}</span>
            </div>
          </div>
        `;
      }

      if (!disableModal) {
        el.onclick = (e) => {
          e.stopPropagation();
          showCardModal(card);
        };
      }
      return el;
    }

    function getCardLabel(cardId, cardsList) {
      const c = (cardsList || []).find(item => item && item.instanceId === cardId);
      if (c) {
        return `${c.name || c.definitionId} (Lv.${c.level} AP:${c.ap})`;
      }
      return `カード (${cardId})`;
    }

    function render(obs) {
      if (document.getElementById('cpu-toggle')) {
        document.getElementById('cpu-toggle').checked = !!obs.p2IsCpu;
      }
      const roomTag = obs.roomId && obs.roomId !== 'default' ? `[部屋:${obs.roomId}] ` : '';
      document.getElementById('match-info').innerText = `${roomTag}T:${obs.turn} (${obs.turnPlayerId === currentViewingPlayer ? '自ターン' : '相手T'})`;

      if (obs.waitingForPlayer2) {
        const decBox = document.getElementById('decision-box');
        decBox.style.display = 'block';
        document.getElementById('decision-title').innerText = `⏳ 対戦相手の参加を待っています...`;
        document.getElementById('decision-desc').innerText = `部屋番号は「${obs.roomId}」です。相手の端末でこの番号を入力して参加してください。`;
        document.getElementById('decision-actions').innerHTML = '';
        return;
      }
      
      const me = obs.me;
      const opp = obs.opponent;

      // Counters
      document.getElementById('me-id').innerText = `${me.playerId} ${me.isFirstPlayer ? '[先攻]' : '[後攻]'}`;
      document.getElementById('me-deck').innerText = me.deckCount;
      document.getElementById('me-hand-count').innerText = me.handCount;
      document.getElementById('me-file').innerText = me.fileCount;
      document.getElementById('me-evidence').innerText = me.evidenceCount;
      document.getElementById('me-remove').innerText = me.removeCount;
      document.getElementById('me-case-phase').innerText = me.casePhase === 'RESOLUTION' ? '解決編' : '事件編';

      document.getElementById('opp-id').innerText = `${opp.playerId} ${opp.isFirstPlayer ? '[先攻]' : '[後攻]'}`;
      document.getElementById('opp-deck').innerText = opp.deckCount;
      document.getElementById('opp-hand-count').innerText = opp.handCount;
      document.getElementById('opp-file').innerText = opp.fileCount;
      document.getElementById('opp-evidence').innerText = opp.evidenceCount;
      document.getElementById('opp-remove').innerText = opp.removeCount;
      document.getElementById('opp-case-phase').innerText = opp.casePhase === 'RESOLUTION' ? '解決編' : '事件編';

      // Field
      const meField = document.getElementById('me-field');
      meField.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        meField.appendChild(createCardEl(me.field[i]));
      }
      document.getElementById('me-case').replaceWith(createCardSlot('me-case', me.case));
      document.getElementById('me-partner').replaceWith(createCardSlot('me-partner', me.partner));

      const oppField = document.getElementById('opp-field');
      oppField.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        oppField.appendChild(createCardEl(opp.field[i]));
      }
      document.getElementById('opp-case').replaceWith(createCardSlot('opp-case', opp.case));
      document.getElementById('opp-partner').replaceWith(createCardSlot('opp-partner', opp.partner));

      // Hand
      const meHand = document.getElementById('me-hand');
      meHand.innerHTML = '';
      me.hand.forEach(c => meHand.appendChild(createCardEl(c)));

      // Decision Box
      const decBox = document.getElementById('decision-box');
      const decActs = document.getElementById('decision-actions');
      decActs.innerHTML = '';

      if (obs.winnerId) {
        decBox.style.display = 'block';
        document.getElementById('decision-title').innerText = `🏆 勝者: ${obs.winnerId}`;
        document.getElementById('decision-desc').innerText = `決着: ${obs.finishReason === 'CASE_RESOLVED' ? '事件解決！' : obs.finishReason}`;
        return;
      }

      if (obs.pendingDecision) {
        decBox.style.display = 'block';
        const pd = obs.pendingDecision;
        
        if (pd.kind === 'mulligan') {
          document.getElementById('decision-title').innerText = `🃏 初期手札マリガン (引き直し)`;
          document.getElementById('decision-desc').innerText = `戻したいカードをタップして選択してください`;

          const mScroll = document.createElement('div');
          mScroll.className = 'mulligan-scroll';

          (pd.options.handCardIds || []).forEach(cid => {
            const cardObj = me.hand.find(c => c && c.instanceId === cid);
            const item = document.createElement('div');
            item.className = `mulligan-item ${selectedMulliganIds.has(cid) ? 'selected' : ''}`;
            const cardEl = createCardEl(cardObj, false, true);
            item.appendChild(cardEl);
            item.onclick = (e) => {
              e.stopPropagation();
              if (selectedMulliganIds.has(cid)) {
                selectedMulliganIds.delete(cid);
                item.classList.remove('selected');
              } else {
                selectedMulliganIds.add(cid);
                item.classList.add('selected');
              }
              const confirmBtn = document.getElementById('mulligan-confirm-btn');
              if (confirmBtn) {
                confirmBtn.innerText = `🔄 ${selectedMulliganIds.size}枚戻す`;
              }
            };
            mScroll.appendChild(item);
          });
          decActs.appendChild(mScroll);

          const btnRow = document.createElement('div');
          btnRow.style.display = 'flex';
          btnRow.style.gap = '8px';
          btnRow.style.width = '100%';
          btnRow.style.marginTop = '6px';

          const btnConfirm = document.createElement('button');
          btnConfirm.id = 'mulligan-confirm-btn';
          btnConfirm.className = 'btn btn-danger';
          btnConfirm.style.flex = '1';
          btnConfirm.innerText = `🔄 ${selectedMulliganIds.size}枚戻す`;
          btnConfirm.onclick = () => submitDecision({ cardIds: Array.from(selectedMulliganIds) });
          btnRow.appendChild(btnConfirm);

          const btnPass = document.createElement('button');
          btnPass.className = 'btn btn-success';
          btnPass.style.flex = '1';
          btnPass.innerText = '✨ このまま開始';
          btnPass.onclick = () => submitDecision({ cardIds: [] });
          btnRow.appendChild(btnPass);

          decActs.appendChild(btnRow);

        } else if (pd.kind === 'mainAction') {
          document.getElementById('decision-title').innerText = `⚡ あなたの手番です`;
          document.getElementById('decision-desc').innerText = `アクションを選択してください`;

          (pd.options.actions || []).forEach(act => {
            if (act.type === 'END_TURN') {
              const b = document.createElement('button');
              b.className = 'btn btn-secondary';
              b.innerText = '⏭ ターン終了';
              b.onclick = () => submitDecision({ type: 'END_TURN' });
              decActs.appendChild(b);
            } else if (act.type === 'HAND_PLAY') {
              act.cardIds.forEach(cid => {
                const b = document.createElement('button');
                b.className = 'btn';
                const label = getCardLabel(cid, me.hand);
                b.innerText = `🃏 登場: ${label}`;
                b.onclick = () => submitDecision({ type: 'HAND_PLAY', cardId: cid });
                decActs.appendChild(b);
              });
            } else if (act.type === 'HINT_TAKE') {
              const b = document.createElement('button');
              b.className = 'btn';
              b.innerText = '💡 ヒント (FILE回収)';
              b.onclick = () => submitDecision({ type: 'HINT_TAKE' });
              decActs.appendChild(b);
            } else if (act.type === 'ASSIST') {
              const b = document.createElement('button');
              b.className = 'btn';
              b.innerText = '🤝 アシスト (FILEへ)';
              b.onclick = () => submitDecision({ type: 'ASSIST' });
              decActs.appendChild(b);
            } else if (act.type === 'RESOLVE_CASE') {
              const b = document.createElement('button');
              b.className = 'btn btn-danger';
              b.innerText = '✨ 事件解決宣言 (勝利！)';
              b.onclick = () => submitDecision({ type: 'RESOLVE_CASE' });
              decActs.appendChild(b);
            } else if (act.type === 'DEDUCE') {
              act.actorIds.forEach(aid => {
                const b = document.createElement('button');
                b.className = 'btn';
                const allMine = [...me.field, me.partner];
                const label = getCardLabel(aid, allMine);
                b.innerText = `🔎 推理: ${label}`;
                b.onclick = () => submitDecision({ type: 'DEDUCE', actorId: aid });
                decActs.appendChild(b);
              });
            } else if (act.type === 'ACTION') {
              act.actorIds.forEach(aid => {
                act.targetIds.forEach(tid => {
                  const b = document.createElement('button');
                  b.className = 'btn btn-danger';
                  const actorLabel = getCardLabel(aid, me.field);
                  const allOpp = [...opp.field, opp.case];
                  const targetLabel = getCardLabel(tid, allOpp);
                  b.innerText = `⚔️ 攻撃: ${actorLabel} ➔ ${targetLabel}`;
                  b.onclick = () => submitDecision({ type: 'ACTION', actorId: aid, targetId: tid });
                  decActs.appendChild(b);
                });
              });
            }
          });
        } else if (pd.kind === 'guard') {
          document.getElementById('decision-title').innerText = `🛡️ ガード選択`;
          document.getElementById('decision-desc').innerText = `ガードするキャラを選ぶかスルー`;

          const btnPass = document.createElement('button');
          btnPass.className = 'btn btn-secondary';
          btnPass.innerText = 'スルー';
          btnPass.onclick = () => submitDecision({ guardCardId: null });
          decActs.appendChild(btnPass);

          (pd.options.guardCardIds || []).forEach(gid => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-danger';
            const label = getCardLabel(gid, me.field);
            btn.innerText = `🛡️ ガード: ${label}`;
            btn.onclick = () => submitDecision({ guardCardId: gid });
            decActs.appendChild(btn);
          });
        } else if (pd.kind === 'hintPlay') {
          document.getElementById('decision-title').innerText = `💡 ヒント後の手札登場`;
          document.getElementById('decision-desc').innerText = `回収後、手札を登場させられます`;

          const btnPass = document.createElement('button');
          btnPass.className = 'btn btn-secondary';
          btnPass.innerText = 'スキップ';
          btnPass.onclick = () => submitDecision({ cardId: null });
          decActs.appendChild(btnPass);

          (pd.options.playableCardIds || []).forEach(cid => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            const label = getCardLabel(cid, me.hand);
            btn.innerText = `🃏 登場: ${label}`;
            btn.onclick = () => submitDecision({ cardId: cid });
            decActs.appendChild(btn);
          });
        }
      } else {
        if (obs.decisionPlayerId) {
          decBox.style.display = 'block';
          document.getElementById('decision-title').innerText = `相手 (${obs.decisionPlayerId}) 思考中...`;
          document.getElementById('decision-desc').innerText = 'お待ちください';
        } else {
          decBox.style.display = 'none';
        }
      }
    }

    function createCardSlot(id, card) {
      const el = createCardEl(card);
      el.id = id;
      return el;
    }

    // ========== DECK BUILDER LOGIC ==========
    async function loadDeckBuilderData() {
      try {
        const [catRes, deckRes, decksListRes] = await Promise.all([
          fetch('/api/catalog'),
          fetch('/api/deck'),
          fetch('/api/decks')
        ]);
        const catJson = await catRes.json();
        const deckJson = await deckRes.json();
        const decksListJson = await decksListRes.json();

        catalogData = catJson.cards || [];
        currentDeckDef = deckJson;

        // Init qty map
        deckQtyMap = {};
        (deckJson.mainDeck || []).forEach(item => {
          deckQtyMap[item.definitionId] = item.count;
        });

        // Update deck name input
        const nameInput = document.getElementById('builder-deck-name');
        if (nameInput) {
          nameInput.value = currentDeckDef.deckName || 'カスタムデッキ';
        }

        renderSavedDecksDropdown(decksListJson.decks || []);
        populateFixedSelects();
        renderBuilderCatalog();
        updateBuilderSummary();
      } catch (e) {
        console.error(e);
      }
    }

    function renderSavedDecksDropdown(decks) {
      const sel = document.getElementById('saved-decks-select');
      if (!sel) return;
      sel.innerHTML = '';
      decks.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.deckId || d.fileId;
        opt.innerText = `${d.deckName} (${d.totalCards}/40枚)`;
        if (d.isActive || (currentDeckDef && (currentDeckDef.deckId === d.deckId || currentDeckDef.deckId === d.fileId))) {
          opt.selected = true;
        }
        sel.appendChild(opt);
      });
    }

    async function onSelectSavedDeck(deckId) {
      if (!deckId) return;
      try {
        const res = await fetch(`/api/decks/${encodeURIComponent(deckId)}`);
        if (!res.ok) throw new Error("デッキ読み込みに失敗しました");
        const deckData = await res.json();
        
        currentDeckDef = deckData;
        deckQtyMap = {};
        (deckData.mainDeck || []).forEach(item => {
          deckQtyMap[item.definitionId] = item.count;
        });

        const nameInput = document.getElementById('builder-deck-name');
        if (nameInput) {
          nameInput.value = currentDeckDef.deckName || deckId;
        }

        populateFixedSelects();
        renderBuilderCatalog();
        updateBuilderSummary();
      } catch (e) {
        alert(e.message);
      }
    }

    function createNewDeckPrompt() {
      const name = prompt("新しいデッキ名を入力してください:", "新デッキ");
      if (!name) return;
      
      const newId = "deck_" + Date.now();
      currentDeckDef = {
        deckId: newId,
        deckName: name,
        partnerId: currentDeckDef.partnerId || '',
        caseId: currentDeckDef.caseId || '',
        mainDeck: []
      };
      deckQtyMap = {};

      const nameInput = document.getElementById('builder-deck-name');
      if (nameInput) nameInput.value = name;

      populateFixedSelects();
      renderBuilderCatalog();
      updateBuilderSummary();
    }

    async function deleteCurrentDeckSlot() {
      const deckId = currentDeckDef.deckId;
      if (!deckId) {
        alert("削除するデッキが選択されていません");
        return;
      }
      if (!confirm(`デッキ「${currentDeckDef.deckName || deckId}」を削除してもよろしいですか？`)) {
        return;
      }
      try {
        const res = await fetch(`/api/decks/${encodeURIComponent(deckId)}`, { method: 'DELETE' });
        if (!res.ok) throw new Error("削除に失敗しました");
        alert("デッキを削除しました");
        loadDeckBuilderData();
      } catch (e) {
        alert(e.message);
      }
    }

    function populateFixedSelects() {
      const partnerSel = document.getElementById('builder-partner-select');
      const caseSel = document.getElementById('builder-case-select');

      partnerSel.innerHTML = '';
      caseSel.innerHTML = '';

      catalogData.filter(c => c.cardType === 'PARTNER' || c.cardType === 'パートナー').forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.definitionId;
        opt.innerText = `[${c.definitionId}] ${c.title || c.dummyName}`;
        if (c.definitionId === currentDeckDef.partnerId) opt.selected = true;
        partnerSel.appendChild(opt);
      });

      catalogData.filter(c => c.cardType === 'CASE' || c.cardType === '事件').forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.definitionId;
        opt.innerText = `[${c.definitionId}] ${c.title || c.dummyName}`;
        if (c.definitionId === currentDeckDef.caseId) opt.selected = true;
        caseSel.appendChild(opt);
      });
    }

    function updateDeckPartner(val) { currentDeckDef.partnerId = val; }
    function updateDeckCase(val) { currentDeckDef.caseId = val; }

    function getCanonicalId(defId) {
      const card = catalogData.find(c => c.definitionId === defId);
      return (card && (card.canonicalId || card.cardId)) || defId;
    }

    function getCanonicalTotal(targetDefId, targetDelta = 0) {
      const targetCanon = getCanonicalId(targetDefId);
      let total = 0;
      for (const defId in deckQtyMap) {
        if (getCanonicalId(defId) === targetCanon) {
          total += deckQtyMap[defId];
        }
      }
      return total + targetDelta;
    }

    function changeCardQty(defId, delta) {
      const cur = deckQtyMap[defId] || 0;
      if (delta > 0) {
        const canonTotal = getCanonicalTotal(defId, 0);
        if (canonTotal >= 3) {
          const card = catalogData.find(c => c.definitionId === defId);
          const cId = getCanonicalId(defId);
          alert(`同一カードID（${cId}）はパラレル版も含めて合計3枚までです。`);
          return;
        }
      }

      const next = Math.max(0, Math.min(3, cur + delta));
      if (next === 0) {
        delete deckQtyMap[defId];
      } else {
        deckQtyMap[defId] = next;
      }
      const qtyEl = document.getElementById(`qty-${defId}`);
      if (qtyEl) qtyEl.innerText = next;
      updateBuilderSummary();
    }

    function updateBuilderSummary() {
      let total = 0;
      const canonicalCounts = {};
      let hasOverLimit = false;
      let overLimitMsg = '';

      for (const defId in deckQtyMap) {
        const cnt = deckQtyMap[defId];
        total += cnt;
        const canonId = getCanonicalId(defId);
        canonicalCounts[canonId] = (canonicalCounts[canonId] || 0) + cnt;
        if (canonicalCounts[canonId] > 3) {
          hasOverLimit = true;
          overLimitMsg = `同一カードID(${canonId})が4枚以上あります`;
        }
      }
      document.getElementById('builder-total-count').innerText = total;

      const badge = document.getElementById('builder-status-badge');
      if (hasOverLimit) {
        badge.className = 'deck-valid-badge deck-valid-ng';
        badge.innerText = overLimitMsg;
      } else if (total === 40) {
        badge.className = 'deck-valid-badge deck-valid-ok';
        badge.innerText = '構築完了 (40/40)';
      } else {
        badge.className = 'deck-valid-badge deck-valid-ng';
        badge.innerText = total > 40 ? `超過 (${total}/40)` : `不足 (${total}/40)`;
      }
    }

    function renderBuilderCatalog(filterQuery = '') {
      const container = document.getElementById('builder-catalog-container') || document.getElementById('builder-catalog-grid');
      container.innerHTML = '';

      const query = (filterQuery || '').trim().toLowerCase();
      const mainPool = catalogData.filter(c => {
        const t = c.cardType || '';
        return t === 'CHARACTER' || t === 'EVENT' || t === 'キャラ' || t === 'キャラクター' || t === 'イベント';
      });

      const filtered = mainPool.filter(c => {
        if (!query) return true;
        const title = (c.title || c.dummyName || '').toLowerCase();
        const desc = (c.description || '').toLowerCase();
        const defId = (c.definitionId || '').toLowerCase();
        return title.includes(query) || desc.includes(query) || defId.includes(query);
      });

      const start = builderPage * PAGE_SIZE;
      const pageItems = filtered.slice(start, start + PAGE_SIZE);

      // Page info
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      const pageInfo = document.createElement('div');
      pageInfo.style.cssText = 'font-size:0.75rem; color:var(--text-muted); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;';
      pageInfo.innerHTML = `
        <span>${filtered.length}枚中 ${start+1}〜${Math.min(start+PAGE_SIZE, filtered.length)}枚表示</span>
        <span style="display:flex;gap:6px;align-items:center;">
          <button class="qty-btn" style="width:auto;padding:2px 10px;" onclick="builderPage=Math.max(0,builderPage-1);renderBuilderCatalog(document.getElementById('catalog-search-input').value)" ${builderPage===0?'disabled':''}>◀</button>
          <span>${builderPage+1} / ${totalPages}</span>
          <button class="qty-btn" style="width:auto;padding:2px 10px;" onclick="builderPage=Math.min(${totalPages-1},builderPage+1);renderBuilderCatalog(document.getElementById('catalog-search-input').value)" ${builderPage>=totalPages-1?'disabled':''}>▶</button>
        </span>
      `;
      container.appendChild(pageInfo);

      const cardGrid = document.createElement('div');
      cardGrid.className = 'catalog-grid';
      container.appendChild(cardGrid);

      pageItems.forEach(c => {
        const qty = deckQtyMap[c.definitionId] || 0;
        const item = document.createElement('div');
        item.className = 'catalog-card-item';

        const imgHtml = c.mainPath
          ? `<img src="/card-images/${c.mainPath}" loading="lazy" style="width:100%;border-radius:4px;margin-bottom:4px;aspect-ratio:2/3;object-fit:cover;" onerror="this.style.display='none'">`
          : `<div style="width:100%;aspect-ratio:2/3;background:#0f172a;border-radius:4px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;color:#475569;font-size:0.65rem;">NO IMG</div>`;

        item.innerHTML = `
          <div class="card-click-area" style="cursor:pointer; flex:1; display:flex; flex-direction:column;">
            ${imgHtml}
            <div class="card-top">
              <span class="card-badge">${c.cardType === 'EVENT' ? 'イベント' : 'キャラ'}</span>
              <span>Lv.${c.level}</span>
            </div>
            <div class="card-name">${c.title || c.dummyName}</div>
            <div style="font-size:0.58rem; color:var(--text-muted); margin-bottom:2px;">ID: ${c.canonicalId || c.cardId || '-'} (${c.definitionId})</div>
            <div class="card-stats">
              <span class="stat-ap">AP${c.ap ?? '-'}</span>
              <span class="stat-lp">LP${c.lp ?? '-'}</span>
            </div>
          </div>
          <div class="card-qty-controller">
            <button class="qty-btn" onclick="changeCardQty('${c.definitionId}', -1)">−</button>
            <span class="qty-num" id="qty-${c.definitionId}">${qty}</span>
            <button class="qty-btn" onclick="changeCardQty('${c.definitionId}', 1)">＋</button>
          </div>
        `;
        // Use addEventListener to safely pass the card object (avoids JSON escaping issues)
        item.querySelector('.card-click-area').addEventListener('click', () => showCardModal(c));
        cardGrid.appendChild(item);
      });

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'color:var(--text-muted);text-align:center;padding:20px;grid-column:1/-1;';
        empty.innerText = '該当カードが見つかりません';
        cardGrid.appendChild(empty);
      }
    }

    function filterCatalog(q) {
      builderPage = 0;
      renderBuilderCatalog(q);
    }

    async function saveAndApplyDeck() {
      let total = 0;
      const mainList = [];
      for (const defId in deckQtyMap) {
        const cnt = deckQtyMap[defId];
        if (cnt > 0) {
          total += cnt;
          mainList.push({ definitionId: defId, count: cnt });
        }
      }

      if (total !== 40) {
        alert(`メインデッキはちょうど40枚にする必要があります。（現在: ${total}枚）`);
        return;
      }
      if (!currentDeckDef.partnerId || !currentDeckDef.caseId) {
        alert("パートナーカードと事件カードを選択してください。");
        return;
      }

      const deckNameInput = document.getElementById('builder-deck-name');
      const chosenName = (deckNameInput && deckNameInput.value.trim()) || currentDeckDef.deckName || "カスタムデッキ";
      const chosenId = currentDeckDef.deckId || ("deck_" + Date.now());

      const savePayload = {
        deckId: chosenId,
        deckName: chosenName,
        catalogVersion: "official-raw-v1",
        partnerId: currentDeckDef.partnerId,
        caseId: currentDeckDef.caseId,
        mainDeck: mainList
      };

      try {
        const res = await fetch('/api/save_deck', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(savePayload)
        });
        const result = await res.json();
        if (res.ok) {
          alert("デッキを保存しました！対戦画面に移動します。");
          switchTab('battle');
        } else {
          alert(`保存エラー: ${result.error}`);
        }
      } catch (e) {
        alert(`通信エラー: ${e.message}`);
      }
    }

    setInterval(fetchState, 1000);
    fetchState();
  </script>
</body>
</html>
